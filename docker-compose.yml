services:
  db:
    image: postgres:16-alpine
    container_name: rickfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rickfolio
      POSTGRES_PASSWORD: rickfolio
      POSTGRES_DB: rickfolio
    volumes:
      - rickfolio_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rickfolio" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rickfolio_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rickfolio:rickfolio@db:5432/rickfolio
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  rickfolio_postgres_data: